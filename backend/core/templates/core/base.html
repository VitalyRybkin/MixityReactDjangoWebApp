<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API Docs{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            padding: 48px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 32px;
        }

        .title {
            margin: 0 0 8px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: var(--shadow);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.09);
            border-color: #cbd5e1;
        }

        .card-title {
            margin: 0 0 10px;
            font-size: 1.05rem;
            font-weight: 650;
        }

        .card-url {
            color: var(--muted);
            font-size: 0.92rem;
            word-break: break-word;
            margin-bottom: 14px;
        }

        .card-action {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .footer {
            margin-top: 36px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #111827;
                --text: #e5e7eb;
                --muted: #94a3b8;
                --border: #1f2937;
                --accent: #60a5fa;
                --shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
            }

            body {
                background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
            }

            .card:hover {
                border-color: #334155;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main class="page">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
