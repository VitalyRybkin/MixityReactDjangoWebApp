name: Backend Tests and Deploy

on:
  pull_request:
    branches:
      - release
      - master

  push:
    branches:
      - release
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mixity_test
          POSTGRES_USER: mixity
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mixity -d mixity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DB_NAME: mixity_test
      DB_USER: mixity
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSL_MODE: disable

      DJANGO_DEBUG: "False"
      DJANGO_SEED_DATA: "False"
      DJANGO_SECRET_KEY: github-actions-test-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost

      VITE_API_URL: http://localhost/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Run backend tests
        run: make test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    needs:
      - backend-tests

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    environment:
      name: production
      url: https://app.mixity.ru

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${VPS_PORT:-22}" \
            "${VPS_USER}@${VPS_HOST}" \
            'bash -se' <<'DEPLOY_SCRIPT'
              set -Eeuo pipefail

              PROJECT_DIR="/opt/MixityReactDjangoWebApp"

              cd "$PROJECT_DIR"

              echo "Updating master..."
              git fetch origin master
              git reset --hard origin/master

              echo "Checking Docker Compose configuration..."
              docker compose config --quiet

              echo "Building application..."
              docker compose build

              echo "Starting application..."
              docker compose up -d --remove-orphans

              echo "Waiting for backend..."
              sleep 10

              echo "Checking Django..."
              docker compose exec -T backend python manage.py check

              echo "Container status:"
              docker compose ps

              echo "Removing unused images..."
              docker image prune -f

              echo "Deployment completed."
          DEPLOY_SCRIPT