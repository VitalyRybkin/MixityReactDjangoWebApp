services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    env_file:
      - ./backend/.env.docker

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://' + '127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - mixity_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DJANGO_SEED_DATA: "True"

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    env_file:
      - ./backend/.env.docker

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - ./backend/credentials/seed_users.json:/app/credentials/seed_users.json:ro

    expose:
      - "8000"

    networks:
      - mixity_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - django_static:/var/www/django-static:ro
      - django_media:/var/www/media:ro

    networks:
      - mixity_network


volumes:
  postgres_data:
  django_static:
  django_media:


networks:
  mixity_network:
    driver: bridge