services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    pids_limit: 64

    environment:
      CLAMAV_NO_FRESHCLAMD: "true"

    volumes:
      - clamav_db:/var/lib/clamav

    networks:
      - mixity_network

  db:
    image: postgres:17-alpine

    env_file:
      - ./backend/.env.docker

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - mixity_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DJANGO_SEED_DATA: "True"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://' + '127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    env_file:
      - ./backend/.env.docker

    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy

    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - ./backend/credentials/seed_users.json:/app/credentials/seed_users.json:ro

    expose:
      - "8000"

    networks:
      - mixity_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    pids_limit: 64

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - django_static:/var/www/django-static:ro
      - django_media:/var/www/media:ro

    networks:
      - mixity_network


volumes:
  postgres_data:
  django_media:
  django_static:
  clamav_db:


networks:
  mixity_network:
    driver: bridge